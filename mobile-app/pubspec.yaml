name: faso_yiri
description: "Plateforme Educative Burkina Faso - Application Mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^15.1.2

  # State Management
  flutter_riverpod: ^2.6.1
  # Network
  dio: ^5.7.0
  connectivity_plus: ^6.1.4

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # Video Player
  video_player: ^2.9.4
  chewie: ^1.10.0

  # Offline / Storage
  path_provider: ^2.1.5
  sqflite: ^2.4.1

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  percent_indicator: ^4.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
